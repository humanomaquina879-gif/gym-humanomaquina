<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronox Gym | Catálogo</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kronox: {
                            bg: '#050a14',
                            cardBg: '#091122',
                            cardBorder: '#16284a',
                            accent: '#00d2ff',
                            accentDark: '#0077ff',
                            blueDark: '#080e1a',
                            glow: 'rgba(0, 210, 255, 0.25)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050a14;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-grid-pattern {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(0, 210, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 210, 255, 0.04) 1px, transparent 1px);
        }

        .glow-light {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, rgba(5, 10, 20, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        /* Tarjeta adaptativa que NO recorta ninguna imagen */
        .gallery-card {
            background: linear-gradient(160deg, #0a1326 0%, #060c18 100%);
            border: 1px solid #16284a;
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            break-inside: avoid;
            margin-bottom: 1.5rem;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
            box-shadow: 0 12px 30px rgba(0, 210, 255, 0.25);
        }

        .gallery-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain; /* Garantiza 0% recorte de texto */
            transition: transform 0.5s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.02);
        }

        .btn-neon-outline {
            background: transparent;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
        }

        .btn-neon-outline:hover {
            background: #00d2ff;
            color: #050a14;
            box-shadow: 0 0 22px rgba(0, 210, 255, 0.6);
        }
    </style>
</head>
<body class="bg-grid-pattern relative min-h-screen flex flex-col justify-between">

    <!-- Ambient Glow Effects -->
    <div class="glow-light top-0 left-1/2 -translate-x-1/2"></div>
    <div class="glow-light bottom-20 right-0"></div>

    <!-- NAVBAR SUPERIOR -->
    <header class="sticky top-0 z-50 bg-kronox-bg/85 backdrop-blur-lg border-b border-kronox-cardBorder/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            
            <!-- Logo Oficial en Imagen (Tamaño Doble) -->
            <a href="index" class="flex items-center gap-2 group py-2">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783041430/Logo_Kronox_Gym_lfg9tl.jpg" 
                     alt="Kronox Gym Logo" 
                     class="h-16 md:h-20 w-auto rounded-xl border border-kronox-accent/40 object-contain shadow-[0_0_15px_rgba(0,210,255,0.2)] group-hover:border-kronox-accent transition-all duration-300">
            </a>

            <!-- Navegación Desktop -->
            <nav class="hidden md:flex items-center space-x-8 font-semibold text-sm">
                <a href="index" class="text-gray-300 hover:text-kronox-accent transition-colors">Inicio</a>
                <a href="informacion" class="text-gray-300 hover:text-kronox-accent transition-colors">Información</a>
                <a href="planes" class="text-gray-300 hover:text-kronox-accent transition-colors">Planes</a>
                <a href="catalogo" class="text-kronox-accent font-bold border-b-2 border-kronox-accent pb-1">Catálogo</a>
                <a href="ubicacion" class="text-gray-300 hover:text-kronox-accent transition-colors">Ubicación</a>
            </nav>

            <!-- Botón Contactar / WhatsApp -->
            <div class="hidden md:flex items-center">
                <a href="https://wa.me/527779393985?text=Hola%20Kronox%20Gym,%20me%20gustar%C3%ADa%20pedir%20informaci%C3%B3n." target="_blank" class="btn-neon-outline px-5 py-2.5 rounded-lg font-bold text-xs uppercase tracking-wider flex items-center gap-2">
                    <i class="fab fa-whatsapp text-base"></i> Contactar
                </a>
            </div>

            <!-- Botón Menú Móvil -->
            <button id="mobile-menu-btn" class="md:hidden text-gray-300 hover:text-white text-2xl focus:outline-none">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Menú Desplegable Móvil -->
        <div id="mobile-menu" class="hidden md:hidden bg-kronox-blueDark border-b border-kronox-cardBorder px-6 pt-3 pb-6 space-y-3">
            <a href="index" class="block py-2 text-gray-300 hover:text-kronox-accent font-medium">Inicio</a>
            <a href="informacion" class="block py-2 text-gray-300 hover:text-kronox-accent font-medium">Información</a>
            <a href="planes" class="block py-2 text-gray-300 hover:text-kronox-accent font-medium">Planes</a>
            <a href="catalogo" class="block py-2 text-kronox-accent font-bold">Catálogo</a>
            <a href="ubicacion" class="block py-2 text-gray-300 hover:text-kronox-accent font-medium">Ubicación</a>
            <a href="https://wa.me/527779393985?text=Hola%20Kronox%20Gym" target="_blank" class="inline-block mt-3 w-full text-center btn-neon-outline py-2.5 rounded-lg font-bold text-xs uppercase">
                <i class="fab fa-whatsapp"></i> Contactar por WhatsApp
            </a>
        </div>
    </header>

    <!-- SECCIÓN PRINCIPAL -->
    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 md:py-14 flex-grow">
        
        <!-- HERO / ENCABEZADO -->
        <div class="text-center max-w-3xl mx-auto mb-12">
            <!-- Logo oficial de Cloudinary -->
            <div class="mb-6 inline-block p-1.5 rounded-2xl bg-kronox-cardBg/90 border border-kronox-accent/40 shadow-[0_0_25px_rgba(0,210,255,0.2)]">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783041430/Logo_Kronox_Gym_lfg9tl.jpg" 
                     alt="Kronox Gym Logo" 
                     class="h-16 md:h-20 w-auto rounded-xl object-contain">
            </div>

            <!-- Título -->
            <h1 class="text-4xl sm:text-6xl font-black tracking-tight text-white uppercase italic leading-none">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-kronox-accent to-blue-500">CATÁLOGO</span>
            </h1>

            <p class="mt-4 text-gray-300 text-sm sm:text-base font-normal max-w-xl mx-auto">
                Conoce nuestras instalaciones y el ambiente de Kronox Gym.
            </p>
        </div>

        <!-- GALERÍA EN MASONRY (CASCADA PERFECTA SIN RECORTE) -->
        <div class="columns-1 sm:columns-2 lg:columns-3 gap-6 max-w-6xl mx-auto space-y-6">
            
            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783101131/1A_cdkrls.jpg" alt="Kronox Gym">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783101154/2A_dmabog.jpg" alt="Kronox Gym">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783101174/3A_jrmdzv.jpg" alt="Kronox Gym">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783101199/4A_o5km6x.jpg" alt="Kronox Gym">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783278596/Pierna_m7pt8m.jpg" alt="Área de Pierna">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783278559/Peso_libre_dofgd7.jpg" alt="Peso Libre">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783278548/Pecho_ezsgft.jpg" alt="Área de Pecho">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783278534/Jaula_8_estaciones_gzspd7.jpg" alt="Jaula 8 Estaciones">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783278520/Cardio_jled0t.jpg" alt="Zona de Cardio">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1789679975/ef15c86e-b3e8-4987-8a14-034e0e2a43ce_j7jh2u.jpg" alt="Instalaciones">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1789679822/8840939f-2647-4154-9a5c-8c0782c5408e_jjhdko.jpg" alt="Instalaciones">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1789679785/de4afdc6-7a18-4c52-943f-13438409d802_kkynz3.jpg" alt="Instalaciones">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1789679879/24a2a454-44be-44b4-ae46-9546db085e8d_j031wi.jpg" alt="Instalaciones">
            </div>

            <div class="gallery-card">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1789679856/ccd17ff1-b129-4d3a-84e6-ddb6ad5ff3f8_rol1kb.jpg" alt="Instalaciones">
            </div>

        </div>

    </main>

    <!-- PIE DE PÁGINA (FOOTER) -->
    <footer class="relative z-10 bg-kronox-blueDark border-t border-kronox-cardBorder/80 py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-6">
            
            <div class="text-center md:text-left">
                <a href="index" class="inline-block">
                    <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783041430/Logo_Kronox_Gym_lfg9tl.jpg" 
                         alt="Kronox Gym Logo" 
                         class="h-16 w-auto rounded-xl border border-kronox-cardBorder object-contain shadow-md">
                </a>
            </div>

            <!-- Redes Sociales con Colores Oficiales FIJOS -->
            <div class="flex items-center space-x-5">
                <!-- Instagram (Degradado Oficial Fijo) -->
                <a href="https://www.instagram.com/kronoxgym" target="_blank" 
                   class="w-10 h-10 rounded-full text-white bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600 border border-pink-500/60 shadow-[0_0_12px_rgba(236,72,153,0.4)] flex items-center justify-center hover:scale-110 hover:shadow-[0_0_20px_rgba(236,72,153,0.7)] transition-all duration-300">
                    <i class="fab fa-instagram text-lg"></i>
                </a>

                <!-- Facebook (Azul Oficial Fijo) -->
                <a href="https://www.facebook.com/profile.php?id=61591217086184" target="_blank" 
                   class="w-10 h-10 rounded-full text-white bg-[#1877F2] border border-[#1877F2] shadow-[0_0_12px_rgba(24,119,242,0.4)] flex items-center justify-center hover:scale-110 hover:shadow-[0_0_20px_rgba(24,119,242,0.7)] transition-all duration-300">
                    <i class="fab fa-facebook-f text-lg"></i>
                </a>

                <!-- TikTok (Negro y Neón Fijo) -->
                <a href="https://www.tiktok.com/@kronoxgym_" target="_blank" 
                   class="w-10 h-10 rounded-full text-white bg-black border border-cyan-400 shadow-[0_0_12px_rgba(0,242,234,0.4)] flex items-center justify-center hover:scale-110 hover:shadow-[0_0_20px_rgba(0,242,234,0.7)] transition-all duration-300">
                    <i class="fab fa-tiktok text-lg"></i>
                </a>

                <!-- WhatsApp (Verde Oficial Fijo) -->
                <a href="https://wa.me/527779393985?text=Hola%20Kronox%20Gym" target="_blank" 
                   class="w-10 h-10 rounded-full text-white bg-[#25D366] border border-[#25D366] shadow-[0_0_12px_rgba(37,211,102,0.4)] flex items-center justify-center hover:scale-110 hover:shadow-[0_0_20px_rgba(37,211,102,0.7)] transition-all duration-300">
                    <i class="fab fa-whatsapp text-lg"></i>
                </a>
            </div>

        </div>
    </footer>

    <!-- Lógica JavaScript Menú Móvil -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
