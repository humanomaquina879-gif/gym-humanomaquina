<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planes y Membresías | Kronox Gym</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kronox: {
                            bg: '#050a14',
                            cardBg: '#091122',
                            cardBorder: '#16284a',
                            accent: '#00d2ff',
                            accentHover: '#00b8e6',
                            blueDark: '#080e1a',
                            glow: 'rgba(0, 210, 255, 0.25)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Estilos CSS Personalizados y Accesibilidad -->
    <style>
        body {
            background-color: #050a14;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            transition: font-size 0.3s ease;
        }

        /* Clases para Accesibilidad / Daltonismo (Colores optimizados para distinguirse mejor) */
        body.daltonism-mode {
            background-color: #0b0c10 !important;
            color: #66fcf1 !important;
        }
        body.daltonism-mode .plan-card, 
        body.daltonism-mode .featured-card,
        body.daltonism-mode header, 
        body.daltonism-mode footer,
        body.daltonism-mode #modal-pago > div,
        body.daltonism-mode #accessibility-dropdown {
            background-color: #1f2833 !important;
            border-color: #66fcf1 !important;
            color: #c5c6c7 !important;
        }
        body.daltonism-mode a, 
        body.daltonism-mode span, 
        body.daltonism-mode h1, 
        body.daltonism-mode h2, 
        body.daltonism-mode h3, 
        body.daltonism-mode p {
            color: #66fcf1 !important;
        }

        /* Tamaños de letra accesibles */
        body.text-lg-mode { font-size: 120%; }
        body.text-xl-mode { font-size: 140%; }

        .bg-grid-pattern {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(0, 210, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 210, 255, 0.04) 1px, transparent 1px);
        }

        .glow-light {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.12) 0%, rgba(5, 10, 20, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .plan-card {
            background: linear-gradient(160deg, #0a1326 0%, #060c18 100%);
            border: 1px solid #16284a;
            border-radius: 1.25rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .plan-card:hover {
            transform: translateY(-8px);
            border-color: #00d2ff;
            box-shadow: 0 15px 35px rgba(0, 210, 255, 0.2);
        }

        .featured-card {
            background: linear-gradient(160deg, #0e1d3a 0%, #071020 100%);
            border: 2px solid #00d2ff;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
            position: relative;
        }

        .featured-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 45px rgba(0, 210, 255, 0.35);
        }

        .btn-neon-outline {
            background: transparent;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.1);
            cursor: pointer;
        }

        .btn-neon-outline:hover {
            background: #00d2ff;
            color: #050a14;
            box-shadow: 0 0 22px rgba(0, 210, 255, 0.6);
        }

        .btn-neon-solid {
            background: #00d2ff;
            color: #050a14;
            transition: all 0.3s ease;
            box-shadow: 0 0 18px rgba(0, 210, 255, 0.4);
            cursor: pointer;
        }

        .btn-neon-solid:hover {
            background: #2dd8ff;
            box-shadow: 0 0 28px rgba(0, 210, 255, 0.8);
            transform: scale(1.02);
        }

        .check-icon {
            color: #00d2ff;
            filter: drop-shadow(0 0 4px rgba(0, 210, 255, 0.6));
        }
    </style>
</head>
<body class="bg-grid-pattern relative min-h-screen flex flex-col justify-between">

    <!-- BOTÓN FLOTANTE Y MENÚ DESPLEGABLE DE ACCESIBILIDAD (Esquina Superior Izquierda) -->
    <div class="fixed top-6 left-6 z-50">
        <button onclick="toggleAccessibilityDropdown()" title="Opciones de accesibilidad y visualización" class="bg-kronox-cardBg border border-kronox-accent/50 text-kronox-accent hover:bg-kronox-accent hover:text-kronox-bg p-3 rounded-full shadow-[0_0_15px_rgba(0,210,255,0.3)] transition-all flex items-center justify-center">
            <i class="fas fa-user text-lg"></i>
        </button>

        <!-- Menú Desplegable -->
        <div id="accessibility-dropdown" class="hidden absolute top-14 left-0 w-64 bg-kronox-cardBg border border-kronox-cardBorder rounded-xl p-4 shadow-2xl backdrop-blur-xl space-y-3">
            <div class="flex justify-between items-center border-b border-kronox-cardBorder pb-2">
                <span class="text-xs font-black uppercase text-kronox-accent tracking-wider"><i class="fas fa-eye mr-1"></i> Accesibilidad Visual</span>
                <button onclick="toggleAccessibilityDropdown()" title="Cerrar menú [X]" class="text-gray-400 hover:text-white text-xs font-bold">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <button onclick="toggleDaltonism()" title="Activar colores optimizados para daltonismo" class="w-full text-left bg-kronox-blueDark hover:bg-kronox-accent hover:text-kronox-bg border border-kronox-cardBorder text-gray-200 px-3 py-2 rounded-lg text-xs font-semibold transition-colors flex items-center gap-2">
                <i class="fas fa-adjust text-kronox-accent"></i> Modo Daltonismo
            </button>
            
            <button onclick="changeFontSize()" title="Ajustar tamaño de la letra" class="w-full text-left bg-kronox-blueDark hover:bg-kronox-accent hover:text-kronox-bg border border-kronox-cardBorder text-gray-200 px-3 py-2 rounded-lg text-xs font-semibold transition-colors flex items-center gap-2">
                <i class="fas fa-text-height text-kronox-accent"></i> Cambiar Tamaño Letra
            </button>
        </div>
    </div>

    <!-- Ambient Glow Effects -->
    <div class="glow-light top-0 left-1/2 -translate-x-1/2"></div>
    <div class="glow-light bottom-20 right-0"></div>

    <!-- NAVBAR SUPERIOR -->
    <header class="sticky top-0 z-40 bg-kronox-bg/85 backdrop-blur-lg border-b border-kronox-cardBorder/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            <a href="index" title="Ir al inicio" class="flex items-center gap-2 group py-2 ml-12 sm:ml-0">
                <img src="https://res.cloudinary.com/bo5jzelh/image/upload/v1783041430/Logo_Kronox_Gym_lfg9tl.jpg" 
                     alt="Kronox Gym Logo" 
                     class="h-16 md:h-20 w-auto rounded-xl border border-kronox-accent/40 object-contain shadow-[0_0_15px_rgba(0,210,255,0.2)] group-hover:border-kronox-accent transition-all duration-300">
            </a>

            <nav class="hidden md:flex items-center space-x-8 font-semibold text-sm">
                <a href="index" title="Página principal" class="text-gray-300 hover:text-kronox-accent transition-colors">Inicio</a>
