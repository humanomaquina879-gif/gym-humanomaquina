<script>
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "kronox2026";
        
        // Variable para llevar la cuenta de los intentos fallidos
        let failedAttempts = parseInt(localStorage.getItem("kronox_failed_attempts") || "0");
        const MAX_ATTEMPTS = 5;

        document.addEventListener("DOMContentLoaded", () => {
            // Verificar si ya inició sesión previamente
            if (localStorage.getItem("kronox_admin_logged") === "true") {
                document.getElementById("auth-overlay").style.display = "none";
                return;
            }

            // Verificar si ya alcanzó el límite de intentos
            if (failedAttempts >= MAX_ATTEMPTS) {
                blockAccess("Demasiados intentos fallidos. Acceso bloqueado temporalmente.");
            }
        });

        function handleLogin(event) {
            event.preventDefault();

            // Doble seguridad por si recargan la página
            if (failedAttempts >= MAX_ATTEMPTS) return;

            const userTyped = document.getElementById("admin-user").value;
            const passTyped = document.getElementById("admin-pass").value;
            const errorDiv = document.getElementById("login-error");

            if (userTyped === ADMIN_USER && passTyped === ADMIN_PASS) {
                // Si entra bien, reiniciamos los intentos y damos acceso
                localStorage.setItem("kronox_admin_logged", "true");
                localStorage.removeItem("kronox_failed_attempts");
                document.getElementById("auth-overlay").style.display = "none";
            } else {
                failedAttempts++;
                localStorage.setItem("kronox_failed_attempts", failedAttempts);
                
                const remaining = MAX_ATTEMPTS - failedAttempts;

                if (failedAttempts >= MAX_ATTEMPTS) {
                    blockAccess("Límite de intentos alcanzado. Acceso bloqueado.");
                } else {
                    errorDiv.classList.remove("hidden");
                    errorDiv.innerText = `Usuario o contraseña incorrectos. Te quedan ${remaining} intentos.`;
                }
            }
        }

        function blockAccess(message) {
            const form = document.getElementById("login-form");
            const errorDiv = document.getElementById("login-error");
            
            form.style.opacity = "0.4";
            form.style.pointerEvents = "none";
            
            errorDiv.classList.remove("hidden");
            errorDiv.innerText = message;
            errorDiv.style.color = "#ff4d4d";
        }

        function logoutAdmin() {
            localStorage.removeItem("kronox_admin_logged");
            location.reload();
        }
    </script>
