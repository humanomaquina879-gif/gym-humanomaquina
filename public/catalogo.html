    <!-- Lógica JavaScript y Accesibilidad -->
    <script>
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // Funciones de Accesibilidad con persistencia en localStorage
        function toggleAccessibilityDropdown() {
            const dropdown = document.getElementById('accessibility-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function toggleDaltonism() {
            document.body.classList.toggle('daltonism-mode');
            const isDaltonism = document.body.classList.contains('daltonism-mode');
            localStorage.setItem('kronox_daltonism', isDaltonism ? 'enabled' : 'disabled');
        }

        // Cambiar tamaño de letra mediante el selector desplegable
        function changeFontSize(size) {
            document.body.classList.remove('text-lg-mode', 'text-xl-mode');
            
            if (size === 'large') {
                document.body.classList.add('text-lg-mode');
            } else if (size === 'xlarge') {
                document.body.classList.add('text-xl-mode');
            }
            
            localStorage.setItem('kronox_font_size', size);
        }

        // Al cargar la página, aplica automáticamente los ajustes guardados
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('kronox_daltonism') === 'enabled') {
                document.body.classList.add('daltonism-mode');
            }
            
            const savedSize = localStorage.getItem('kronox_font_size') || 'normal';
            const selectElement = document.getElementById('font-size-select');
            if (selectElement) {
                selectElement.value = savedSize;
            }
            changeFontSize(savedSize);
        });
    </script>
